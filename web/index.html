<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2f1ed" />
    <meta
      name="description"
      content="RiftDesk is a focused Riftbound deck studio for finding tournament lists, reading the live meta, and building decks card by card."
    />
    <meta property="og:title" content="RiftDesk · Riftbound deck studio" />
    <meta
      property="og:description"
      content="Find proven Riftbound lists, read the live tournament meta, and build decks card by card."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://riftdesk.com/" />
    <meta property="og:image" content="https://riftdesk.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RiftDesk · Riftbound deck studio" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RiftDesk · Riftbound deck studio" />
    <meta
      name="twitter:description"
      content="Find proven Riftbound lists, read the live tournament meta, and build decks card by card."
    />
    <meta name="twitter:image" content="https://riftdesk.com/og.png" />
    <link rel="icon" href="/riftdesk-mark.svg" type="image/svg+xml" />
    <!-- Card art is served from here; every browse/build view loads dozens of images
         from it, so paying the DNS+TLS handshake now beats paying it on first scroll. -->
    <link rel="preconnect" href="https://static.dotgg.gg" crossorigin />
    <link rel="dns-prefetch" href="https://static.dotgg.gg" />
    <title>RiftDesk · Riftbound deck studio</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("riftdesk-theme") || localStorage.getItem("bound-atlas-theme");
        document.documentElement.dataset.theme = savedTheme === "dark" ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = savedTheme === "dark" ? "#10141b" : "#f2f1ed";
      } catch (_) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#find">Skip to content</a>
    <div id="error" class="error-bar" hidden></div>
    <div id="notice" class="notice-bar" hidden></div>

    <header class="app-header">
      <a class="brand-lockup" href="/" aria-label="RiftDesk home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" focusable="false">
            <path class="brand-mark-back" d="M9 13.5 14.5 8h23L41 11.5v26L37.5 41h-23L11 37.5z" />
            <path class="brand-mark-front" d="M6.5 10.5 10 7h23.5l4 4v26.5L34 41H10l-3.5-3.5z" />
            <path class="brand-mark-rift" d="m27 5-8 13 7 1-9 12 7 1-6 11" />
          </svg>
        </span>
        <span class="brand-wordmark">
          <strong><span>Rift</span><span>Desk</span></strong>
          <small>Riftbound deck studio</small>
        </span>
      </a>
      <nav id="tabs" class="tabs" aria-label="Views"></nav>
      <div class="header-actions">
        <details class="access-menu">
          <summary>Card access</summary>
          <div id="availability" class="availability"></div>
        </details>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode"></button>
      </div>
    </header>

    <main id="app-loading" class="app-loading" aria-live="polite" aria-busy="true">
      <span class="loading-mark" aria-hidden="true"></span>
      <div>
        <strong>Setting up your desk</strong>
        <span>Loading current cards and tournament data…</span>
      </div>
    </main>

    <main id="find" class="panel panel-smart" aria-label="Find a deck" hidden></main>

    <main id="explore" class="panel panel-explore" aria-label="Explore tournament trends" hidden></main>

    <main id="search" class="panel panel-search" aria-label="Search decks by card" hidden></main>

    <main id="build" class="app-body" hidden>
      <div class="panel panel-deck">
        <div id="deck" class="deck"></div>
        <div id="deck-actions" class="library"></div>
      </div>
      <aside id="browser" class="panel panel-browser" aria-label="Card drawer"></aside>
    </main>

    <main id="decks" class="panel panel-library" aria-label="My decks" hidden></main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
